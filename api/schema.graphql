type Article {
  author: Profile!
  body: String!
  createdAt: ISO8601DateTime!
  description: String!

  """
  True when the current user favorited this article.
  """
  favorited: Boolean!
  favoritesCount: Int!
  slug: String!
  tagList: [String!]!
  title: String!
  updatedAt: ISO8601DateTime!
}

type Comment {
  author: Profile!
  body: String!
  createdAt: ISO8601DateTime!
  id: ID!
  updatedAt: ISO8601DateTime!
}

"""
An ISO 8601-encoded datetime
"""
scalar ISO8601DateTime @specifiedBy(url: "https://tools.ietf.org/html/rfc3339")

"""
The credentials of POST /api/users/login.
"""
input LoginUser {
  email: String!
  password: String!
}

type MultipleArticles {
  articles: [Article!]!
  articlesCount: Int!
}

type Mutation {
  addComment(comment: NewComment!, slug: String!): Comment!
  createArticle(article: NewArticle!): Article!
  deleteArticle(slug: String!): Boolean!
  deleteComment(id: ID!, slug: String!): Boolean!
  favoriteArticle(slug: String!): Article!
  followUser(username: String!): Profile!
  login(user: LoginUser!): User!
  register(user: NewUser!): User!
  unfavoriteArticle(slug: String!): Article!
  unfollowUser(username: String!): Profile!
  updateArticle(article: UpdateArticle!, slug: String!): Article!
  updateUser(user: UpdateUser!): User!
}

"""
The new article of POST /api/articles.
"""
input NewArticle {
  body: String!
  description: String!

  """
  The names of the tags. Unknown tags are created.
  """
  tagList: [String!]
  title: String!
}

"""
The new comment of POST /api/articles/:slug/comments.
"""
input NewComment {
  body: String!
}

"""
The new user of POST /api/users.
"""
input NewUser {
  email: String!
  password: String!
  username: String!
}

type Profile {
  bio: String

  """
  True when the current user follows this user.
  """
  following: Boolean!
  image: String
  username: String!
}

type Query {
  """
  GET /api/articles/:slug
  """
  article(slug: String!): Article

  """
  GET /api/articles
  """
  articles(
    author: String

    """
    The username of a user who favorited the articles.
    """
    favorited: String

    """
    The number of items on the page.
    """
    limit: Int = 20

    """
    The number of items to skip.
    """
    offset: Int = 0
    tag: String
  ): MultipleArticles!

  """
  GET /api/articles/:slug/comments
  """
  comments(slug: String!): [Comment!]!

  """
  GET /api/articles/feed
  """
  feed(
    """
    The number of items on the page.
    """
    limit: Int = 20

    """
    The number of items to skip.
    """
    offset: Int = 0
  ): MultipleArticles!

  """
  GET /api/profiles/:username
  """
  profile(username: String!): Profile

  """
  GET /api/tags
  """
  tags: [String!]!

  """
  GET /api/user. The current user, or null without a token.
  """
  user: User
}

"""
The changes of PUT /api/articles/:slug. Fields that are not given do not change.
"""
input UpdateArticle {
  body: String
  description: String

  """
  The names of the tags. Unknown tags are created.
  """
  tagList: [String!]
  title: String
}

"""
The changes of PUT /api/user. Fields that are not given do not change.
"""
input UpdateUser {
  bio: String
  email: String

  """
  The URL of the profile image. An empty string removes it.
  """
  image: String
  password: String
  username: String
}

type User {
  bio: String
  email: String!
  image: String
  token: String!
  username: String!
}
