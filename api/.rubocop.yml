AllCops:
  NewCops: enable
  Exclude:
    - bin/*
    - db/schema.rb
    - db/migrate/*.rb
Layout/LineLength:
  Max: 120
# GraphQL mutations must name their method resolve, even when it returns a Boolean.
Naming/PredicateMethod:
  AllowedMethods:
    - resolve
Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
Style/Documentation:
  Enabled: false
